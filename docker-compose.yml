# =============================================================================
# BlakFile — local development environment.
# Nothing here is production-grade. See docs/deployment-guide.md for prod.
# =============================================================================
name: blakfile

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: blakfile
      POSTGRES_PASSWORD: blakfile
      POSTGRES_DB: blakfile
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blakfile"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the dev bucket on startup, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/blakfile-dev &&
      mc anonymous set none local/blakfile-dev
      "

  clamav:
    image: clamav/clamav:latest
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Optional local AI. Start with: docker compose --profile ai up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports: ["11434:11434"]
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
